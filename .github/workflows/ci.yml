name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Branch-scoped epic trackers are raw material, not documentation: they argue with earlier drafts
  # of themselves and inventory unmitigated gaps. Their durable content is extracted into ADRs
  # before merge. Checked against the tree rather than the diff, so this fails while such a file
  # exists and passes the moment it is deleted.
  #
  # Its own job on purpose: as a step of `build` it would kill every PR before compiling, so an epic
  # branch would get no build or test signal at all until the file was removed. Add it to branch
  # protection's required checks, or it blocks nothing.
  #
  # Deliberately NOT gated on `draft == false`: `ready_for_review` is not among the default
  # pull_request activity types, so a draft-to-ready flip would not re-run this workflow and the
  # guard would never execute on the PR that actually merges.
  wip-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: No WIP trackers reach main
        run: |
          if git ls-tree -r --name-only HEAD | grep -q '^docs/WIP-'; then
            echo "::error::docs/WIP-* must be extracted into ADRs and deleted before merging to main"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B clean install

      - name: Mutation testing (PITest)
        run: mvn -B pitest:mutationCoverage

      - name: Upload build artifacts (target/)
        uses: actions/upload-artifact@v6
        with:
          name: build-target
          path: target/


  sonar:
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-target
          path: target/

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.organization=${SONAR_ORGANIZATION}
